server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 @canonical_not_found;
    location @canonical_not_found {
        return 301 https://pablodavila.eu$request_uri;
    }
}
