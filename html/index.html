<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pablo Dávila - JS-Games</title>
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="games.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Code+Pro:400,900|Source+Sans+Pro:300,900&amp;display=swap"
    />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="games.js" charset="utf-8"></script>
  </head>

  <body>
    <div
      id="games-menu-notice"
      class="menu-popup-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="games-menu-notice-title"
    >
      <div class="menu-popup">
        <p class="menu-popup-text">
          Hi there!
        </p>
        <p class="menu-popup-text">
          This was one of my earliest web projects; it dates to 2020.
        </p>
        <p class="menu-popup-explore">Feel free to move around and explore.</p>
        <button type="button" class="menu-popup-dismiss" id="games-menu-notice-close">
          OK
        </button>
      </div>
    </div>

    <h1 id="main-title">Pablo's JS-Games</h1>

    <p id="subtitle">
      <i>
        Check out the source code of this project in
        <a href="https://github.com/Pablo-Davila/JS-Games" target="_blank"
          >GitHub</a
        >.
      </i>
    </p>

    <div class="container">
      <!-- Tetris -->
      <div id="tetris-card" class="game-card">
        <h3 class="game-title">Tetris</h3>
        <div class="game-tags">
          <span class="tag">Arcade</span>
        </div>
        <img class="game-demo" src="tetris/tetris_demo.gif" />
      </div>

      <!-- PokeMemory -->
      <div id="memory-card" class="game-card">
        <h3 class="game-title">PokeMemory</h3>
        <div class="game-tags">
          <span class="tag">Pokémon</span>
          <span class="tag">PokeAPI</span>
        </div>
        <img class="game-demo" src="memory/memory_demo.gif" />
      </div>

      <!-- Sample -->
      <div class="game-card" style="display: none">
        <h3 class="game-title">Game title</h3>
        <div class="game-tags">
          <span class="tag">tag1</span>
          <span class="tag">tag2</span>
        </div>
        <img class="game-demo" src="tetris/tetris_demo.gif" />
      </div>
    </div>
  </body>
</html>
